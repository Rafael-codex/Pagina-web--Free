function renderFilesGrid(archivos) {
    if (!archivos.length) {
        return `<div class="empty-catalog">
            <i class="fas fa-box-open fa-2x" style="margin-bottom: 12px; opacity:0.7;"></i>
            <p>No hay contenido disponible en esta categoría.</p>
            <button class="btn-sm refresh-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Recargar</button>
        </div>`;
    }
    
    return archivos.map(arch => {
        const isPremium = arch.tipo === 'premium';
        const shareUrl = getShareableUrl(arch.id, arch.nombre);
        return `
        <div class="file-card ${isPremium ? 'premium-card' : ''}">
            <h4>🌐 ${escapeHtml(arch.nombre)}
                <span class="price-tag ${isPremium ? 'premium' : 'free'}">
                    ${isPremium ? `💎 $${(arch.precio || 9.99).toFixed(2)} USD` : '🎁 Gratis'}
                </span>
            </h4>
            ${arch.imagen ? `<img src="${arch.imagen}" class="preview-img-card" alt="preview" loading="lazy" onerror="this.style.display='none'">` : ""}
            <div class="meta-info">
                <span><i class="fas fa-calendar-alt"></i> ${new Date(arch.fecha).toLocaleDateString()}</span>
                <span><i class="fas ${isPremium ? 'fa-youtube' : 'fa-file-code'}"></i> ${isPremium ? 'YouTube (solo vista)' : 'HTML descargable'}</span>
            </div>
            <p style="font-size:0.85rem;margin:8px 0;color:#bbd9ff;">${escapeHtml(arch.descripcion || "Sin descripción adicional")}</p>
            <div class="actions">
                ${isPremium ? `
                    <button class="btn-sm view-btn" data-id="${arch.id}" data-type="view-premium"><i class="fas fa-eye"></i> VER VIDEO</button>
                    <button class="btn-sm buy-btn" data-id="${arch.id}" data-type="buy-premium"><i class="fas fa-shopping-cart"></i> COMPRAR CÓDIGO</button>
                ` : `
                    <button class="btn-sm view-btn" data-id="${arch.id}" data-type="view-code"><i class="fas fa-code"></i> VER CÓDIGO</button>
                    <button class="btn-sm download-btn" data-id="${arch.id}" data-type="download-code"><i class="fas fa-download"></i> DESCARGAR CÓDIGO</button>
                `}
                <button class="btn-sm share-btn" data-id="${arch.id}" data-share-url="${shareUrl}" data-name="${escapeHtml(arch.nombre)}"><i class="fab fa-whatsapp"></i> COMPARTIR</button>
            </div>
        </div>
    `}).join('');
}

function attachGridEvents() {
    // Eventos para los botones del catálogo
    document.querySelectorAll('[data-type="view-premium"]').forEach(btn => {
        btn.onclick = () => {
            const arch = todosLosArchivos.find(a => a.id === btn.dataset.id);
            if (arch?.url) window.open(arch.urlOriginal || arch.url, '_blank');
            else mostrarToast("Video no disponible");
        };
    });
    
    document.querySelectorAll('[data-type="buy-premium"]').forEach(btn => {
        btn.onclick = () => {
            const arch = todosLosArchivos.find(a => a.id === btn.dataset.id);
            if (arch) {
                pendingPremiumItem = arch;
                const modalDiv = document.createElement('div');
                modalDiv.className = "premium-access-modal";
                modalDiv.innerHTML = `
                    <div class="premium-card-modal">
                        <i class="fas fa-crown" style="font-size: 3rem; color: gold;"></i>
                        <h2>🔐 ACCESO PREMIUM</h2>
                        <p>¿Quieres obtener este código premium?
Contáctame por WhatsApp para recibir el acceso completo.<br>✅ Compra segura y verificada.</p>
                        <div class="modal-buttons">
                            <button id="confirmWhatsappBuyBtn" class="btn-whatsapp-modal"><i class="fab fa-whatsapp"></i> Comprar</button>
                            <button id="cancelBuyModalBtn" class="btn-cancel-modal"><i class="fas fa-times"></i> Cancelar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modalDiv);
                document.getElementById("confirmWhatsappBuyBtn").onclick = () => {
                   const nombre = pendingPremiumItem.nombre;
const precio = pendingPremiumItem.precio ?? 9.99;
const baseUrl = window.location.origin + window.location.pathname;
const shareUrl = `${baseUrl}?id=${pendingPremiumItem.id}`;

const mensajeWA =
`Hola, quiero COMPRAR el contenido premium *${nombre}*

💰 Precio: $${precio} USD
🔗 Link: ${shareUrl}`;
window.open(
  `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensajeWA)}`,
  "_blank"
);
                    
                    modalDiv.remove();
                };
                document.getElementById("cancelBuyModalBtn").onclick = () => modalDiv.remove();
            }
        };
    });
    
    document.querySelectorAll('[data-type="view-code"]').forEach(btn => {
        btn.onclick = () => {
            const arch = todosLosArchivos.find(a => a.id === btn.dataset.id);
            if (arch?.contenido) {
                const ventana = window.open('', '_blank');
                ventana.document.write(arch.contenido);
                ventana.document.close();
            } else mostrarToast("Código no disponible");
        };
    });
    
    document.querySelectorAll('[data-type="download-code"]').forEach(btn => {
        btn.onclick = () => {
            const arch = todosLosArchivos.find(a => a.id === btn.dataset.id);
            if (arch?.contenido) {
                const blob = new Blob([arch.contenido], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = arch.nombreArchivo || `${arch.nombre.replace(/[^a-z0-9]/gi, '_')}.html`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                mostrarToast("✅ Descarga iniciada");
            } else mostrarToast("Descarga no disponible");
        };
    });
    
    document.querySelectorAll('.share-btn').forEach(btn => {
        btn.onclick = () => {
            const shareUrl = btn.dataset.shareUrl;
            const name = btn.dataset.name;
            const mensaje = `📢 *${name}* - Mira este contenido en Rafael-Codex: ${shareUrl}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, '_blank');
            mostrarToast("📱 Compartiendo por WhatsApp");
        };
    });
}

// Cargar datos y decidir vista según URL
async function loadAndRoute() {
    const container = document.getElementById("mainContainer");
    container.innerHTML = '<div class="container"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando contenido exclusivo...</div></div>';
    
    try {
        const q = query(archivosCollection, orderBy('timestamp', 'desc'));
        const snap = await getDocs(q);
        todosLosArchivos = [];
        snap.forEach(docSnap => {
            const d = docSnap.data();
            if (!d.tipo) d.tipo = "gratis";
            if (d.tipo === "premium" && !d.precio) d.precio = 9.99;
            if (d.nombre && (d.tipo === 'gratis' ? d.contenido : d.url)) {
                todosLosArchivos.push({ id: docSnap.id, ...d });
            }
        });
        
        // Revisar si hay un ID en la URL (para vista individual)
        const urlParams = new URLSearchParams(window.location.search);
        const codeId = urlParams.get('id');
        
        if (codeId) {
            const found = todosLosArchivos.find(item => item.id === codeId);
            if (found) {
                renderSingleView(found);
                return;
            }
        }
        renderCatalog();
    } catch(err) {
        console.error("Error:", err);
        container.innerHTML = `<div class="container"><div class="preview-card"><p>Error cargando datos. <button onclick="location.reload()">Reintentar</button></p></div></div>`;
    }
}

loadAndRoute();
window.addEventListener('popstate', () => loadAndRoute());
</script>

document.addEventListener('keydown', function(e) {

    // CTRL + S
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        mostrarToast("⚠️ Guardado bloqueado");
    }

    // CTRL + U
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        mostrarToast("⚠️ Acción bloqueada");
    }

    // CTRL + SHIFT + I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        mostrarToast("⚠️ DevTools bloqueado");
    }

    // CTRL + SHIFT + J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        mostrarToast("⚠️ Acción bloqueada");
    }

    // F12
    if (e.key === 'F12') {
        e.preventDefault();
        mostrarToast("⚠️ Inspección bloqueada");
    }

});

// BLOQUEAR SELECCIÓN
document.addEventListener('selectstart', e => e.preventDefault());

// BLOQUEAR ARRASTRAR
document.addEventListener('dragstart', e => e.preventDefault());
</script>
